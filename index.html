<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Matheasy</title>
    <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
</head>
<body>
    <h2>Matheasy <span class="version">v0.0.5 — phase 0</span></h2>
    <p>Insère le corpus de test dans le document pour vérifier le rendu des équations natives.</p>
    <button id="run-corpus">Insérer le corpus de test</button>
    <button id="run-exp">Insérer les expériences</button>
    <button id="run-probe">Sonder l'API</button>
    <button id="run-fmt">Test : rouge + barré sur la sélection</button>
    <button id="run-json">Test : lire la sélection (JSON)</button>
    <textarea id="log" readonly rows="18" style="width:100%;box-sizing:border-box" placeholder="Journal (Ctrl+A puis Ctrl+C pour copier)"></textarea>
    <script src="scripts/plugin.js"></script>
</body>
</html>
